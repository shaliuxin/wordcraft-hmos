[package]
name = "wordcraft-hmos"
version = "0.15.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "wordcraft_hmos"
crate-type = ["staticlib"]

[dependencies]
# 上游前端与引擎：path 依赖，上游文件零改动。WordApp 已把宿主缝直接暴露为
# new/logic/raw_input_hook/ui/run，无需 patch 上游，与 solidcraft 的 SolveApp 同构。
wordcraft-ui-egui = { path = "../../../wordcraft/crates/ui-egui" }
wordcraft-engine = { path = "../../../wordcraft/crates/engine" }
# egui 0.37 / egui-wgpu 0.37：与 wordcraft 根 Cargo.toml 的 [patch] 同一 git fork rev，
# 否则跨边界 egui 类型全对不上（与 solidcraft 0.36 的教训同源）。
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37" }
# GLES/EGL 后端是鸿蒙 NDK 能直接用的那套；丢 gles 鸿蒙就没渲染后端（与 photocraft/solidcraft 同源教训）。
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "gles"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
raw-window-handle = "0.6"
libc = "0.2"

# [patch] 只对 workspace 根生效；本适配层是独立 workspace，必须把 wordcraft 根 Cargo.toml 的
# [patch.crates-io] 整段抄过来，再叠加 wgpu-hal 的鸿蒙 GLES 修补（沿用 solidcraft 验证过的 30.0.1）。
[patch.crates-io]
# egui 全家桶与 winit：wordcraft 用的 fork，rev 必须与上游锁一致。
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
# wordcraft 引擎/前端依赖的 craft-libs（craft-ui/craft-i18n/craft-window/craft-update/craft-proof/craft-pdf）。
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
craft-update = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }
craft-proof = { git = "https://github.com/storytold/craft-libs", rev = "01315d9c92b5b0e69082d35ca56099461a1efd45" }
craft-font-store = { git = "https://github.com/storytold/craft-libs", rev = "762a06a4c6b48b522b7d4de84a87917ef90265e6" }
craft-font-catalog = { git = "https://github.com/storytold/craft-libs", rev = "762a06a4c6b48b522b7d4de84a87917ef90265e6" }
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }
# wgpu-hal：鸿蒙 GLES 需 uniform-block 修补，沿用 solidcraft 验证过的同一 30.0.1，目录不存在即报错。
wgpu-hal = { path = "../../third_party/wgpu-hal-30.0.1" }

[workspace]
